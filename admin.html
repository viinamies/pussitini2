<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel — Name Here</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="shell header-inner"><div class="nav-left"><a class="brand" href="index.html"><span>NH</span></a><nav class="nav-pill"><a href="index.html">Main</a><a href="forum.html">Forum</a><a href="market.html">Market</a><a href="tickets.html">Tickets</a></nav></div><div class="nav-right"><button class="download" data-theme-toggle>☼ Theme</button><a class="profile" href="account.html"><span class="avatar">N</span><span>Account</span></a></div></div></header><main class="shell"><div class="page-head"><div class="eyebrow">Administration</div><h1>Admin panel</h1><p>Manage support requests and user accounts. Access is restricted to approved administrators.</p></div><div class="content"><div class="row" style="margin-bottom:16px;flex-wrap:wrap"><div class="tabs"><button class="active" data-admin-filter="all">All tickets</button><button data-admin-filter="open">Open</button><button data-admin-filter="in_progress">In progress</button><button data-admin-filter="closed">Closed</button></div><button class="secondary" id="admin-refresh">Refresh</button></div><div class="panel" id="admin-tickets"><div class="panel-pad muted small">Checking admin access…</div></div><section class="panel panel-pad" id="ticket-detail" hidden style="margin-top:16px"><div class="row"><div><div class="eyebrow">Ticket details</div><h2 id="detail-subject" style="font-size:19px;margin:5px 0"></h2></div><button class="secondary" id="close-detail">Close</button></div><p id="detail-meta" class="muted small"></p><p id="detail-body"></p><div id="replies" class="panel" style="margin:15px 0"></div><form id="reply-form" class="form-grid"><div class="field"><label for="reply-text">Reply to user</label><textarea id="reply-text" required placeholder="Write a helpful response…">
